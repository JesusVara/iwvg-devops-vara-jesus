logging:
  level:
    es.upm.miw: DEBUG
spring:
  datasource:
    url: jdbc:h2:mem:users-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop