spring:
  application:
    name: users-service
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:usersdb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:users}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:users}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
